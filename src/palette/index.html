<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find a tab</title>
    <link rel="stylesheet" href="./palette.css" />
  </head>
  <body>
    <main class="palette" aria-labelledby="palette-title">
      <h1 id="palette-title" class="visually-hidden">Find an open tab</h1>
      <label class="search-field">
        <span class="visually-hidden">Search open tabs</span>
        <svg aria-hidden="true" viewBox="0 0 20 20" width="20" height="20">
          <path d="m14.2 13 4.4 4.4-1.2 1.2-4.4-4.4a7 7 0 1 1 1.2-1.2ZM8.5 14A5.5 5.5 0 1 0 8.5 3a5.5 5.5 0 0 0 0 11Z" />
        </svg>
        <input
          id="tab-search"
          type="search"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="tab-results"
          aria-expanded="true"
          placeholder="Search open tabs"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
        <kbd>Esc</kbd>
      </label>
      <ul id="tab-results" class="results" role="listbox"></ul>
      <p id="empty-state" class="empty-state" hidden>No matching open tabs</p>
      <footer class="palette-footer">
        <p id="palette-status" class="status" role="status">Loading open tabs…</p>
        <p class="keyboard-hints" aria-hidden="true">
          <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span><kbd>↵</kbd> open</span>
        </p>
      </footer>
    </main>
    <script type="module" src="./palette.ts"></script>
  </body>
</html>
